<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cumple de Elena 12</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe6f0;--card:#fff8fb;--pink:#ff6fa8;--deep:#b0306a;--ink:#5a1f3d;--gold:#f4c76a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
font-family:"Quicksand","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#ffe6f0;--card:#fff8fb;--ink:#5a1f3d}}
:root[data-theme="dark"]{--bg:#ffe6f0;--card:#fff8fb;--ink:#5a1f3d}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{height:100%;display:flex;flex-direction:column;background:var(--bg) radial-gradient(#fff9 2px,transparent 2.5px) 0 0/34px 34px;font-weight:600}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;min-height:46px}
header button{margin:0;padding:6px 14px;font-size:16px}
.st{background:var(--gold);border-radius:999px;padding:5px 14px;font-weight:700}
#app{flex:1;min-height:0;overflow-y:auto;padding:6px 18px 28px}
h1,h2{font-family:"Playfair Display",Georgia,serif;font-style:italic;color:var(--deep);line-height:1.1;text-align:center}
h1{font-size:34px}h2{font-size:28px;margin-bottom:6px}
p{font-size:17px;line-height:1.4;text-align:center;margin-top:10px}
.c{display:flex;flex-direction:column;align-items:center}
.ribbon{background:var(--pink);color:#fff;border-radius:999px;padding:5px 18px;font-weight:700;margin-bottom:10px}
.cover{width:min(76%,300px);border-radius:22px;border:6px solid #fff;box-shadow:0 8px 0 #ff6fa855;margin:14px 0;transform:rotate(-2deg)}
button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--deep);background:#fff;color:var(--deep);border-radius:999px;padding:12px 22px;font-size:18px;margin-top:12px;box-shadow:0 4px 0 var(--deep);touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
button.big{background:var(--pink);color:#fff;border-color:var(--deep)}
button:disabled{opacity:.55}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
.menu{display:grid;gap:12px;margin-top:16px}
.menu button{margin:0;text-align:left;display:flex;gap:12px;align-items:center;border-radius:22px;padding:16px 18px;font-size:19px}
.menu small{display:block;font-weight:600;font-size:14px;opacity:.8}
input[type=text],textarea{width:100%;font:inherit;font-size:19px;padding:12px;border-radius:16px;border:2px solid var(--deep);background:#fff;color:var(--ink);margin-top:14px;text-align:center}
textarea{text-align:left;min-height:110px}
.lbl{display:inline-block;border:2px dashed var(--deep);border-radius:999px;padding:9px 18px;cursor:pointer;background:#fff9;margin-top:10px;font-weight:700}
.reto{background:var(--card);border-radius:22px;padding:14px;margin-top:12px;border:2px solid #fff;box-shadow:0 4px 0 #ff6fa84d;display:flex;gap:12px;align-items:center}
.reto.ok{background:#fff3c9}
.reto .e{font-size:34px}.reto b{display:block;font-size:18px}.reto span{font-size:14px;font-weight:500}
.reto img{width:64px;height:64px;object-fit:cover;border-radius:14px;border:2px solid #fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:3px solid #fff}
.badge{background:var(--card);border-radius:20px;padding:12px 16px;margin-top:10px;display:flex;gap:12px;align-items:center}
.badge.off{opacity:.4;filter:grayscale(1)}
video{width:100%;border-radius:18px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;z-index:9;max-width:88%;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wa{display:inline-block;margin-top:12px;text-decoration:none;font-weight:700;border:2px solid var(--deep);border-radius:999px;padding:12px 22px;background:#fff;color:var(--deep);box-shadow:0 4px 0 var(--deep)}
.sel{background:var(--gold)}
</style>
</head>

const UC={};const U=k=>typeof M[k]=="string"?M[k]:(UC[k]||(UC[k]=URL.createObjectURL(M[k])));
const blobOf=k=>{const v=M[k];if(typeof v!="string")return v;const a=v.split(","),bs=atob(a[1]),u=new Uint8Array(bs.length);for(let i=0;i<bs.length;i++)u[i]=bs.charCodeAt(i);return new Blob([u],{type:"image/jpeg"})};
async function decode(f){try{return await createImageBitmap(f)}catch(e){const u=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(f)});return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error("imagen no válida"));im.src=u})}}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
async function shrink(f){const b=await decode(f),k=Math.min(1,900/Math.max(b.width,b.height)),w=Math.round(b.width*k),h=Math.round(b.height*k);
 const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(b,0,0,w,h);
 const bar=Math.max(28,Math.round(h*.06)),fs=Math.round(bar*.55);x.fillStyle="rgba(255,255,255,.85)";x.fillRect(0,h-bar,w,bar);
 x.fillStyle="#b0306a";x.font="bold "+fs+"px sans-serif";x.fillText("⭐ "+S.name+" · Cumple de Elena 12",Math.round(fs*.6),h-bar/2+fs/3);
 return c.toDataURL("image/jpeg",.82)}
async function put(k,v){M[k]=v;delete UC[k];delete S.up[k];save();
 try{await idbPut(k,v)}catch(e){let ok=false;if(typeof v=="string"){try{localStorage.setItem("elena12_"+k,v);ok=true}catch(e2){}}if(!ok)toast("Ojo: no se guardará si cierras la página")}}
async function share(k,name){const B=blobOf(k),f=new File([B],name,{type:B.type});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Cumple de Elena 12"})}catch(e){}}
 else toast("Mantén pulsado para guardarlo en tu galería")}
const keys=p=>Object.keys(M).filter(k=>k[0]==p);
const stars=()=>Object.keys(S.done).length;
const unlocked=()=>S.test||Date.now()>=T20;
const V={
welcome:()=>`<div class="c"><div class="ribbon">📅 22 de octubre</div><h1 id="ttl">Cumple de Elena 12</h1><img class="cover" src="${COVER}" alt="Elena en el espejo, con muñequitas de dibujo a su alrededor"><p>💕 Bienvenidas a mi día especial<br>Cread recuerdos, haced fotos y disfrutad juntas.</p><button class="big" data-go="${S.name?"menu":"name"}">🎀 Entrar a la aventura</button></div>`,
name:()=>`<div class="c"><h2>¿Cómo te llamas?</h2><p>Tu nombre saldrá en tus fotos para que sepamos que son tuyas.</p><input type="text" id="nm" maxlength="20" placeholder="Tu nombre" value="${esc(S.name)}" aria-label="Tu nombre"><button class="big" data-go="menu" id="nmgo">Empezar ✨</button></div>`,
menu:()=>`<h2>Hola, ${esc(S.name)} 🌸</h2><div class="menu">
<button data-go="fotos">📸<span>Mis fotos<small>Sube fotos y comparte tu álbum</small></span></button>
<button data-go="retos">🎯<span>Retos<small>${stars()} estrellas conseguidas</small></span></button>
<button data-go="msgs">💌<span>Mensajes para Elena<small>Escribe tu dedicatoria</small></span></button>
<button data-go="enviar">📤<span>Enviar todo a Julia<small>Fotos, vídeos y mensaje</small></span></button>
<button data-go="logros">👑<span>Mis logros<small>Insignias divertidas</small></span></button>
<button data-go="momento">🎉<span>Momento Elena<small>${unlocked()?"¡Ya está abierto!":"Se abre a las 20:00"}</small></span></button>
<button data-go="secreto">🔒<span>Solo para Elena<small>Después del cumple</small></span></button></div>`,
fotos:()=>{const ks=keys("p").concat(keys("f"));return `<h2>Mis fotos 📸</h2><div class="c"><label class="lbl">＋ Subir foto<input type="file" accept="image/*" multiple data-free hidden></label></div>${ks.length?`<div class="grid">${ks.map(k=>`<img data-share="${k}" src="${U(k)}" alt="Una foto tuya">`).join("")}</div><p style="font-size:14px">Toca una foto para compartirla con Julia o tus amigas.</p>`:"<p>Aún no hay fotos. ¡Haz la primera!</p>"}`},
retos:()=>`<h2>Retos de la tarde 🛍️</h2><p style="margin-top:2px">Cada reto da una estrella ⭐</p>`+R.map((r,i)=>{if(r.s&&stars()<5)return `<div class="reto"><span class="e">🔒</span><div><b>Misión secreta</b><span>Se desbloquea con 5 estrellas</span></div></div>`;
 const d=S.done[i];return `<div class="reto ${d?"ok":""}"><span class="e">${d?"⭐":r.e}</span><div style="flex:1"><b>${r.t}</b><span>${r.d}</span>${r.ph?`<label class="lbl" style="padding:6px 14px;font-size:15px">📷 ${M["p"+i]?"Cambiar":"Hacer foto"}<input type="file" accept="image/*" capture="environment" data-ph="${i}" hidden></label>`:`<br><button data-done="${i}" style="padding:6px 14px;font-size:15px;margin-top:8px">${d?"Hecho ✅":"¡Hecho!"}</button>`}</div>${M["p"+i]?`<img src="${U("p"+i)}" alt="Tu foto del reto">`:""}</div>`}).join(""),
msgs:()=>`<h2>Mensaje para Elena 💌</h2><p>Escribe lo que quieras decirle. Después lo envías a Julia y Elena lo verá más adelante.</p><textarea id="dm" maxlength="500" placeholder="Querida Elena…" aria-label="Tu mensaje">${esc(S.msg)}</textarea><div class="c"><button class="big" data-send>Enviar por WhatsApp 💌</button></div>`,
logros:()=>{const n=keys("p").length+keys("f").length,b=[["📸","Fotógrafa","5 fotos o más",n>=5],["⭐","Cazaestrellas","5 estrellas",stars()>=5],["🎬","Actriz","Un vídeo en el Momento Elena",keys("v").length>0],["💌","Cariñosa","Un mensaje enviado",S.sent>0],["👑","Reina del mall","Todos los retos",R.every((r,i)=>S.done[i]||r.s&&stars()<5)&&stars()>=8]];
 return `<h2>Mis logros 👑</h2>`+b.map(x=>`<div class="badge ${x[3]?"":"off"}"><span style="font-size:32px">${x[0]}</span><div><b>${x[1]}</b><br><span style="font-size:14px">${x[2]}</span></div></div>`).join("")},
momento:()=>{if(!unlocked())return `<div class="c"><h2>🎉 Momento Elena 🎉</h2><p style="font-size:60px">🔒</p><p>Se abre hoy a las 20:00. ¡Id pensando qué decir!</p></div>`;
 return `<h2>🎉 Momento Elena 🎉</h2><p>💖 Todas las chicas tienen algo que decir…<br>Elige una frase y graba 10 segundos.</p>`+PROMPTS.map((q,i)=>`<div class="reto" style="display:block"><b>${q}</b>${M["v"+i]?`<video controls playsinline src="${U("v"+i)}"></video><div class="row"><button data-vs="${i}">Compartir 💌</button></div>`:""}<div class="c"><label class="lbl">🎥 ${M["v"+i]?"Grabar otra vez":"Grabar vídeo"}<input type="file" accept="video/*" capture="user" data-vid="${i}" hidden></label></div></div>`).join("")},
enviar:()=>{const ph=keys("p").concat(keys("f")),vd=keys("v"),pend=ph.concat(vd).filter(k=>!S.up[k]).length;
 return `<h2>Enviar a Julia 📤</h2><p>Tienes ${ph.length} foto${ph.length==1?"":"s"}, ${vd.length} vídeo${vd.length==1?"":"s"}${S.msg?" y un mensaje":""}.</p><div class="c">${CLOUD.name?`<button class="big" data-up id="upb">⬆️ Subir todo (${pend} pendiente${pend==1?"":"s"})</button><p id="ups" style="font-size:14px">Tus fotos se envían solas a Julia. Si alguna falló, pulsa este botón.</p>`:""}<button data-shall>📲 Compartir todo (WhatsApp, correo…)</button>${WA_GRUPO?`<a class="wa" href="${WA_GRUPO}" target="_blank" rel="noopener">💬 Abrir el grupo de WhatsApp</a>`:""}${WA_TEL?`<a class="wa" href="https://wa.me/${WA_TEL}?text=${encodeURIComponent("Hola Julia, soy "+S.name+" 💕")}" target="_blank" rel="noopener">💬 Escribir a Julia</a>`:""}<p style="font-size:14px">Al compartir, elige el chat o grupo de Julia en WhatsApp.</p></div>`},
secreto:()=>{if(!S.test&&Date.now()<TEND)return `<div class="c"><h2>Solo para Elena 🔒</h2><p style="font-size:60px">🎁</p><p>Esta pantalla se abre después del cumple.</p></div>`;
 return `<h2>Solo para Elena 💖</h2>`+(ELENA.length?ELENA.map(m=>`<div class="badge"><div><b>${esc(m[0])}</b><br>${esc(m[1])}</div></div>`).join(""):"<p>Aquí aparecerán los mensajes de tus amigas.</p>")}};
const ext=k=>k[0]!="v"?".jpg":/quicktime/.test(M[k].type)?".mov":".mp4";
function summary(){return "Cumple de Elena 12\nNombre: "+S.name+"\nEstrellas: "+stars()+"\nRetos hechos: "+(R.filter((r,i)=>S.done[i]).map(r=>r.t).join(", ")||"ninguno")+"\nFotos: "+(keys("p").length+keys("f").length)+" · Vídeos: "+keys("v").length+"\nMensaje para Elena: "+(S.msg||"(sin mensaje)")}
async function up1(kind,body,name){const fd=new FormData();fd.append("file",body,name);fd.append("upload_preset",CLOUD.preset);fd.append("folder",CLOUD.folder+"/"+(S.name||"sin-nombre").replace(/[^\w-]/g,"_"));
 const r=await fetch("https://api.cloudinary.com/v1_1/"+CLOUD.name+"/"+kind+"/upload",{method:"POST",body:fd});if(!r.ok)throw new Error(r.status)}
async function uploadAll(){const b=$("#upb"),st=$("#ups"),ks=keys("p").concat(keys("f"),keys("v")).filter(k=>!S.up[k]);let n=0;b.disabled=true;
 try{for(const k of ks){st.textContent="Subiendo "+(++n)+" de "+(ks.length+1)+"…";await up1(k[0]=="v"?"video":"image",blobOf(k),k+ext(k));S.up[k]=1;save()}
  st.textContent="Subiendo resumen…";await up1("raw",new Blob([summary()],{type:"text/plain"}),"resumen.txt");
  st.textContent="¡Listo! Todo enviado ✅";toast("¡Todo enviado a Julia! 💖")}
 catch(er){st.textContent="Falló la subida. Inténtalo otra vez.";toast("No se pudo subir. Revisa internet")}
 b.disabled=false}
async function shareAll(){const fs=keys("p").concat(keys("f"),keys("v")).map(k=>{const B=blobOf(k);return new File([B],(k[0]=="v"?"video-":"foto-")+S.name+"-"+k+ext(k),{type:B.type})});
 const d={text:summary(),title:"Cumple de Elena 12"};if(fs.length)d.files=fs;
 try{if(navigator.canShare&&navigator.canShare(d))await navigator.share(d);else await navigator.share({text:summary()})}catch(er){if(er.name!="AbortError")toast("Este móvil no permite compartir todo junto. Usa «Mis fotos»")}}
let busy=false;
async function autoUp(){if(!CLOUD.name||busy)return;busy=true;
 try{for(const k of keys("p").concat(keys("f"),keys("v"))){if(S.up[k])continue;await up1(k[0]=="v"?"video":"image",blobOf(k),k+ext(k));S.up[k]=1;save();toast("☁️ Enviada a Julia")}}catch(e){}
 busy=false}
async function autoMsg(){if(!CLOUD.name||!S.msg)return;try{await up1("raw",new Blob(["Mensaje para Elena de "+S.name+":\n"+S.msg],{type:"text/plain"}),"mensaje-"+Date.now()+".txt")}catch(e){}}
function go(v){cur=v;$("#back").hidden=(v=="welcome"||v=="menu"||v=="name");const s=$("#st");s.hidden=!S.name||v=="welcome";s.textContent="⭐ "+stars();app.innerHTML=V[v]();app.scrollTop=0}
function again(){const t=app.scrollTop;go(cur);app.scrollTop=t}
$("#back").onclick=()=>go("menu");
app.addEventListener("click",async e=>{
 const t=e.target;
 if(t.id=="ttl"){if(++taps>=5){taps=0;S.test=!S.test;save();toast(S.test?"Modo prueba ON: todo abierto":"Modo prueba OFF")}return}
 const g=t.closest("[data-go]");if(g){if(cur=="name"){const v=$("#nm").value.trim();if(!v){toast("Escribe tu nombre 💕");return}S.name=v;save()}go(g.dataset.go);return}
 const d=t.closest("[data-done]");if(d){const i=d.dataset.done;if(S.done[i])delete S.done[i];else S.done[i]=1;save();again();return}
 if(t.closest("[data-up]")){uploadAll();return}if(t.closest("[data-shall]")){shareAll();return}
 const sh=t.closest("[data-share]");if(sh){share(sh.dataset.share,"foto-"+S.name+".jpg");return}
 const vs=t.closest("[data-vs]");if(vs){share("v"+vs.dataset.vs,"video-"+S.name+".mp4");return}
 if(t.closest("[data-send]")){const x=$("#dm").value.trim();if(!x){toast("Escribe tu mensaje primero");return}
  const msg="💌 Mensaje para Elena de "+S.name+":\n"+x;autoMsg();
  if(navigator.share){try{await navigator.share({text:msg});S.sent++;save();toast("¡Mensaje enviado! 💖")}catch(er){}}
  else{window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank","noopener");S.sent++;save()}}
});
app.addEventListener("change",async e=>{
 const i=e.target,fs=i.files;if(!fs||!fs.length)return;
 try{
  if(i.dataset.ph!==undefined){const n=i.dataset.ph;await put("p"+n,await shrink(fs[0]));S.done[n]=1;save();toast("¡Foto guardada! ⭐");again();autoUp()}
  else if(i.hasAttribute("data-free")){for(const f of fs)await put("f"+Date.now()+Math.random().toString(36).slice(2,5),await shrink(f));toast("¡Fotos guardadas! 📸");again();autoUp()}
  else if(i.dataset.vid!==undefined){const f=fs[0];if(f.size>120e6){toast("El vídeo es muy grande. Prueba con uno de 10 segundos");return}await put("v"+i.dataset.vid,f);toast("¡Vídeo guardado! 🎬");again();autoUp()}
 }catch(er){toast("No se pudo guardar la foto ("+(er&&er.message||er)+")")}
});
app.addEventListener("input",e=>{if(e.target.id=="nm"){S.name=e.target.value.trim();save()}else if(e.target.id=="dm"){S.msg=e.target.value;save()}});
idbAll().catch(()=>({})).then(o=>{M=o;try{for(let i=0;i<localStorage.length;i++){const q=localStorage.key(i);if(q.startsWith("elena12_")&&!M[q.slice(8)])M[q.slice(8)]=localStorage.getItem(q)}}catch(e){}}).finally(()=>{go("welcome");autoUp()});window.addEventListener("online",autoUp);
</script>
</body>
</html>
